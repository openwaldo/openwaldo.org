<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenWALDO — coming soon</title>
<meta name="description" content="Open Weights. Open Artifacts. Open Licenses. Open Data. Open Origins. OpenWALDO.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f4eddd'/%3E%3Crect y='4' width='64' height='10' fill='%23e6392f'/%3E%3Crect y='24' width='64' height='10' fill='%23e6392f'/%3E%3Crect y='44' width='64' height='10' fill='%23e6392f'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0c12; color: #ece7dc; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; gap: 26px;
  }
  .stripe {
    position: fixed; left: 0; right: 0; height: 5px;
    background: repeating-linear-gradient(135deg, #ff4a3d 0 12px, #f4eddd 12px 24px);
  }
  .stripe.top { top: 0; } .stripe.bottom { bottom: 0; }
  .wordmark {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-weight: 700; font-size: 26px; letter-spacing: -0.5px;
    display: flex; align-items: center; gap: 12px;
  }
  .wordmark .dot {
    width: 18px; height: 18px; border-radius: 5px;
    background: repeating-linear-gradient(180deg, #ff4a3d 0 4.5px, #f4eddd 4.5px 9px);
  }
  .wordmark em { font-style: normal; color: #ff4a3d; }
  h1 { font-size: clamp(22px, 4vw, 34px); font-weight: 800; letter-spacing: -0.8px; max-width: 720px; line-height: 1.3; }
  h1 .waldo { color: #ff4a3d; }
  p { color: #9aa3b5; font-size: 17px; }
</style>
</head>
<body>
  <div class="stripe top"></div>
  <div class="wordmark"><span class="dot"></span><em>OpenWALDO</em></div>
  <h1>Open Weights. Open Artifacts. Open Licenses. Open Data. Open Origins.<br><span class="waldo">OpenWALDO.</span></h1>
  <p>Coming soon.</p>
  <div class="stripe bottom"></div>
</body>
</html>
