<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenWALDO social preview source</title>
    <style>
      @font-face {
        font-family: "Plex Sans";
        src: url("fonts/ibm-plex-sans.woff2") format("woff2");
      }
      @font-face {
        font-family: "Plex Mono";
        src: url("fonts/ibm-plex-mono.woff2") format("woff2");
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }
      body {
        color: #f4f1e8;
        background: #18211e;
        font-family: "Plex Sans", sans-serif;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 74px 82px;
        background-image:
          linear-gradient(rgba(244, 241, 232, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(244, 241, 232, 0.045) 1px, transparent 1px);
        background-size: 72px 72px;
      }
      .card::before {
        content: "";
        position: absolute;
        inset: 34px 34px auto;
        height: 7px;
        background: #d9634f;
      }
      .card::after {
        content: "";
        position: absolute;
        inset: 34px;
        border: 1px solid rgba(244, 241, 232, 0.28);
        pointer-events: none;
      }
      .copy {
        position: absolute;
        top: 278px;
        left: 82px;
        z-index: 1;
        width: 1036px;
      }
      .brand {
        position: absolute;
        top: 78px;
        left: 82px;
        z-index: 1;
        margin: 0;
        color: #f4f1e8;
        font-size: 68px;
        line-height: 1;
        letter-spacing: -0.04em;
      }
      .brand strong {
        color: #d9634f;
        font-weight: 600;
      }
      h1 {
        margin: 0;
        font-size: 82px;
        line-height: 0.98;
        letter-spacing: -0.055em;
        font-weight: 600;
      }
      h1 small {
        display: block;
        margin-bottom: 18px;
        font:
          19px/1.3 "Plex Mono",
          monospace;
        letter-spacing: 0.14em;
      }
      h1 span {
        color: #d9634f;
      }
      .subline {
        position: absolute;
        right: 82px;
        bottom: 76px;
        left: 82px;
        z-index: 1;
        padding-top: 20px;
        margin: 0;
        border-top: 1px solid rgba(244, 241, 232, 0.14);
        color: rgba(244, 241, 232, 0.78);
        font:
          16px/1 "Plex Mono",
          monospace;
        letter-spacing: 0.13em;
      }
      .mark {
        position: absolute;
        top: 79px;
        right: 86px;
        z-index: 1;
        width: 56px;
        height: 82px;
      }
      .serial {
        position: absolute;
        top: 111px;
        right: 174px;
        z-index: 1;
        color: rgba(244, 241, 232, 0.52);
        font:
          13px/1 "Plex Mono",
          monospace;
        letter-spacing: 0.12em;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="brand">Open<strong>WALDO</strong></p>
      <span class="serial">PROVENANCE / 001</span>
      <img class="mark" src="mark.svg" alt="" />
      <div class="copy">
        <h1><small>THE FIRST OF ITS KIND.</small><span>OPEN-SOURCE</span> AI.</h1>
      </div>
      <p class="subline">COMMUNITY · DATA · TOOLS · MODELS</p>
    </main>
  </body>
</html>
